name: Feature request
description: Explain a use case and the missing capability
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What are you building, and what can you not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested API or behavior
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
