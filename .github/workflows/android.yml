name: Android

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, release AAR and sample
        run: ./gradlew :compose-mindmap:testDebugUnitTest :compose-mindmap:lintDebug :compose-mindmap:assembleRelease :sample:assembleDebug
