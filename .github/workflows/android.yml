name: Android

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, release AAR and sample
        run: ./gradlew :compose-mindmap:testDebugUnitTest :compose-mindmap:lintDebug :compose-mindmap:assembleRelease :sample:assembleDebug

  instrumented:
    name: API ${{ matrix.api-level }} connected tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM group permissions
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
      - name: Run library and sample instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :compose-mindmap:connectedDebugAndroidTest :sample:connectedDebugAndroidTest
      - name: Preserve connected test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-${{ matrix.api-level }}-connected-test-reports
          path: |
            compose-mindmap/build/outputs/androidTest-results/connected/**/*.xml
            compose-mindmap/build/reports/androidTests/connected/**/*.html
            sample/build/outputs/androidTest-results/connected/**/*.xml
            sample/build/reports/androidTests/connected/**/*.html
          if-no-files-found: warn
